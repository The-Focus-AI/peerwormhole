<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>03 File Share</title>
    <link rel="stylesheet" href="/shared/web/base.css">
  </head>
  <body>
    <main>
      <section class="hero">
        <p class="pill">Example 03</p>
        <h1>File Share</h1>
        <p>Chat still works, but now files can move through the same peer mesh, with progress and download links.</p>
      </section>

      <section class="grid two">
        <div class="panel stack">
          <div class="row">
            <div class="pill"><span id="statusDot" class="status-dot"></span> <span id="statusText">Starting peer...</span></div>
            <div class="pill">Your ID: <strong id="peerId">pending</strong></div>
          </div>

          <div id="dropZone" class="drop-zone">Drop a file here or use the picker below.</div>

          <form id="messageForm" class="stack">
            <div class="messages stack" id="messages"></div>
            <div class="row">
              <input id="messageInput" type="text" placeholder="Share a chat update">
              <button type="submit">Send to room</button>
            </div>
          </form>
        </div>

        <aside class="panel stack">
          <label class="stack">
            <span class="muted">Display name</span>
            <input id="nameInput" type="text" value="File Browser">
          </label>

          <label class="stack">
            <span class="muted">Peer ID to connect</span>
            <input id="targetInput" type="text" placeholder="Paste a peer ID">
          </label>

          <div class="row">
            <button id="startButton" type="button">Restart peer</button>
            <button id="connectButton" class="secondary" type="button">Connect</button>
          </div>

          <label class="stack">
            <span class="muted">Send a file</span>
            <input id="fileInput" type="file">
          </label>

          <div class="stack">
            <div class="muted">Peers</div>
            <div id="peers" class="sidebar-list stack"></div>
          </div>

          <div class="stack">
            <div class="muted">Transfers</div>
            <div id="transfers" class="sidebar-list stack"></div>
          </div>
        </aside>
      </section>
    </main>

    <script src="/vendor/peerjs.min.js"></script>
    <script type="module" src="./app.js"></script>
  </body>
  </html>
