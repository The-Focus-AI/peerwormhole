<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>04 Local Workspace</title>
    <link rel="stylesheet" href="/shared/web/base.css">
  </head>
  <body>
    <main>
      <section class="hero">
        <p class="pill">Example 04</p>
        <h1>Local Workspace</h1>
        <p>The CLI process owns the peer connection. This page is a local control panel riding on top of that companion process.</p>
      </section>

      <section class="grid two">
        <div class="panel stack">
          <div class="row">
            <div class="pill">Peer ID: <strong id="peerId">pending</strong></div>
            <div class="pill">Operator: <strong id="userName">pending</strong></div>
          </div>

          <form id="messageForm" class="stack">
            <div class="messages stack" id="messages"></div>
            <div class="row">
              <input id="messageInput" type="text" placeholder="Send through the local CLI companion">
              <button type="submit">Send</button>
            </div>
          </form>
        </div>

        <aside class="panel stack">
          <label class="stack">
            <span class="muted">Connect peer</span>
            <input id="targetInput" type="text" placeholder="Paste a remote peer ID">
          </label>

          <button id="connectButton" type="button">Connect from CLI peer</button>

          <label class="stack">
            <span class="muted">Upload via local bridge</span>
            <input id="fileInput" type="file">
          </label>

          <div class="stack">
            <div class="muted">Peers</div>
            <div id="peers" class="sidebar-list stack"></div>
          </div>

          <div class="stack">
            <div class="muted">Transfers</div>
            <div id="transfers" class="sidebar-list stack"></div>
          </div>

          <div class="stack">
            <div class="muted">Downloads</div>
            <div id="downloads" class="sidebar-list stack"></div>
          </div>
        </aside>
      </section>
    </main>

    <script type="module" src="./app.js"></script>
  </body>
  </html>
